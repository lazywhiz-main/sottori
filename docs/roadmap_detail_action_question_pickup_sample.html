<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>質問ピックアップUIサンプル - Sottori</title>
  <style>
    :root {
      --deep-blue-50: #f0f2ff;
      --deep-blue-100: #e6eaff;
      --deep-blue-200: #d1d9ff;
      --deep-blue-300: #b3c0ff;
      --deep-blue-400: #8a9eff;
      --deep-blue-500: #556AAB;
      --deep-blue-600: #4a5f9f;
      --deep-blue-700: #3d4e85;
      --deep-blue-800: #334070;
      --deep-blue-900: #2d365e;
      --warm-coral-50: #fef7f3;
      --warm-coral-100: #fdeee6;
      --warm-coral-200: #fbd9cc;
      --warm-coral-300: #f7bea8;
      --warm-coral-400: #E69974;
      --warm-coral-500: #df7a5a;
      --warm-coral-600: #d35d4a;
      --warm-coral-700: #b14834;
      --warm-coral-800: #933e2e;
      --warm-coral-900: #7a372c;
      --golden-yellow-50: #fefcf0;
      --golden-yellow-100: #fef7d9;
      --golden-yellow-200: #fdecb3;
      --golden-yellow-300: #fbdc82;
      --golden-yellow-400: #F4CB88;
      --golden-yellow-500: #edb355;
      --golden-yellow-600: #e19834;
      --golden-yellow-700: #bc7a28;
      --golden-yellow-800: #976025;
      --golden-yellow-900: #7a4f22;
      --sage-green-50: #f0f9f4;
      --sage-green-100: #e8f5e8;
      --sage-green-200: #d1e7d1;
      --sage-green-300: #b3d9b3;
      --sage-green-400: #8fcc8f;
      --sage-green-500: #6bbf6b;
      --sage-green-600: #4da64d;
      --sage-green-700: #3d8c3d;
      --sage-green-800: #2d732d;
      --sage-green-900: #1d591d;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "ヒラギノ角ゴシック ProN", "Hiragino Kaku Gothic ProN", "メイリオ", Meiryo, sans-serif;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --transition-fast: 150ms ease-in-out;
      --transition-normal: 250ms ease-in-out;
      --transition-slow: 350ms ease-in-out;
    }
    body {
      font-family: var(--font-sans);
      background: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-12) var(--space-8);
    }
    .header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }
    .header-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: var(--golden-yellow-100);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--golden-yellow-700);
      font-size: 2rem;
    }
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
    }
    .header-desc {
      font-size: 1rem;
      color: var(--gray-600);
      margin-top: var(--space-1);
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--deep-blue-700);
      margin-bottom: var(--space-3);
    }
    .recommend-section, .category-section, .mylist-section {
      margin-bottom: var(--space-8);
    }
    .recommend-list, .category-list, .mylist {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .recommend-item, .category-item, .mylist-item {
      background: var(--deep-blue-50);
      border: 1px solid var(--deep-blue-100);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .add-btn {
      background: var(--deep-blue-500);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: var(--space-1) var(--space-4);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-btn:hover {
      background: var(--deep-blue-600);
    }
    .category-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--gray-100);
      color: var(--deep-blue-700);
      border: none;
      border-radius: var(--radius-md);
      padding: var(--space-2) var(--space-4);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--deep-blue-100);
      color: var(--deep-blue-600);
    }
    .mylist-item {
      background: var(--warm-coral-50);
      border: 1px solid var(--warm-coral-100);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .priority-label {
      font-size: 0.85rem;
      color: var(--golden-yellow-700);
      font-weight: 600;
      background: var(--golden-yellow-100);
      border-radius: var(--radius-md);
      padding: 2px 10px;
      margin-right: var(--space-2);
    }
    .action-btn {
      background: var(--gray-100);
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      padding: var(--space-1) var(--space-3);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
      margin-left: 4px;
    }
    .action-btn:hover {
      background: var(--gray-200);
      border-color: var(--gray-400);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">💡</div>
      <div>
        <div class="header-title">おすすめ質問ピックアップ</div>
        <div class="header-desc">あなたの治療段階や状況に合わせて、よく使われる質問を自動で提案します。</div>
      </div>
    </div>
    <section class="recommend-section">
      <div class="section-title">おすすめ</div>
      <ul class="recommend-list">
        <li class="recommend-item">治療法の選択肢ごとのメリット・デメリットは何ですか？ <button class="add-btn">追加</button></li>
        <li class="recommend-item">副作用や生活への影響について詳しく知りたいです。 <button class="add-btn">追加</button></li>
        <li class="recommend-item">家族がサポートできることは何ですか？ <button class="add-btn">追加</button></li>
      </ul>
    </section>
    <section class="category-section">
      <div class="section-title">カテゴリから選ぶ</div>
      <div class="category-tabs">
        <button class="tab-btn active">治療法</button>
        <button class="tab-btn">副作用・生活</button>
        <button class="tab-btn">費用・制度</button>
        <button class="tab-btn">家族・サポート</button>
        <button class="tab-btn">仕事・社会復帰</button>
        <button class="tab-btn">その他</button>
      </div>
      <ul class="category-list">
        <li class="category-item">治療法の変更は可能ですか？ <button class="add-btn">追加</button></li>
        <li class="category-item">標準治療と先進医療の違いは？ <button class="add-btn">追加</button></li>
      </ul>
    </section>
    <section class="mylist-section">
      <div class="section-title">自分の質問リスト</div>
      <ul class="mylist">
        <li class="mylist-item">
          <span class="priority-label">優先</span>
          治療法の選択肢ごとのメリット・デメリットは何ですか？
          <button class="action-btn">編集</button>
          <button class="action-btn">削除</button>
          <button class="action-btn">↑</button>
          <button class="action-btn">↓</button>
        </li>
        <li class="mylist-item">
          <span class="priority-label">通常</span>
          副作用や生活への影響について詳しく知りたいです。
          <button class="action-btn">編集</button>
          <button class="action-btn">削除</button>
          <button class="action-btn">↑</button>
          <button class="action-btn">↓</button>
        </li>
      </ul>
    </section>
  </div>
</body>
</html>
