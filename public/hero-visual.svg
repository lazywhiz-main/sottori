<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="600" fill="#fefcfb"/>
  
  <!-- 右側の大きなシンプルな曲線 -->
  <path d="M800,0 C1000,100 1200,50 1200,200 L1200,600 L800,600 C700,500 750,300 800,0 Z" 
        fill="#fdf2e9"/>
  
  <!-- 左下の大きなシンプルな曲線 -->
  <path d="M0,400 C200,350 400,450 600,400 L600,600 L0,600 Z" 
        fill="#f8f1eb"/>
  
  <!-- 中央のアクセント要素（小さめ） -->
  <circle cx="900" cy="200" r="60" fill="#e5989b"/>
  
  <!-- 左上の小さなアクセント -->
  <circle cx="150" cy="100" r="35" fill="#b5838d"/>
</svg> 